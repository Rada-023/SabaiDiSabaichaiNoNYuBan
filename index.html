<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>บริษัท สบายดีสบายใจนอนอยู่บ้าน จำกัด — ทีมงานสายชิล</title>
    <!-- Google Fonts for typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            /* โทนสีบ้านๆ อบอุ่น ผ่อนคลายสไตล์อยู่บ้าน */
            background: linear-gradient(135deg, #fef6e4 0%, #f3d2c1 50%, #8bd3dd 100%);
            font-family: 'Prompt', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            color: #001858;
        }

        /* ตกแต่งส่วนหัวเว็บไซต์ให้ติดชิล ไม่เป็นทางการ */
        .header {
            position: absolute;
            top: 25px;
            text-align: center;
            z-index: 10;
            padding: 0 20px;
        }
        
        .header h1 {
            font-family: 'Mali', cursive;
            font-size: 2.2rem;
            font-weight: 700;
            color: #172c66;
            margin-bottom: 6px;
            text-shadow: 2px 2px 0px #ffffff;
        }
        
        .header p {
            font-family: 'Mali', cursive;
            font-size: 1.1rem;
            color: #f582ae;
            background-color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 2px dashed #f582ae;
        }

        .footer-note {
            position: absolute;
            bottom: 20px;
            font-family: 'Mali', cursive;
            font-size: 0.95rem;
            color: #172c66;
            opacity: 0.8;
            background: rgba(255, 255, 255, 0.6);
            padding: 4px 12px;
            border-radius: 12px;
        }

        #root {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🏡 บริษัท สบายดีสบายใจนอนอยู่บ้าน จำกัด</h1>
        <p>✨ สโลแกน: ทำน้อยได้มาก ไม่ทำเลย... สบายใจสุด! ✨</p>
    </div>

    <div id="root"></div>

    <div class="footer-note">💡 เลื่อนขวา-ซ้าย เพื่อส่องสมาชิกสายชิลประจำบ้าน</div>

    <!-- React and Babel CDNs -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // ข้อมูลทีมงาน 5 คน พร้อมตำแหน่งงานปั่นๆ สายชิล
        const DEFAULT_SLIDES = [
            {
                image: { src: "input_file_0.png" },
                title: "🛋️\nตำแหน่ง: ประธานสายโพสท่านั่งโซฟา\n(เน้นนั่งหล่อ ไม่เน้นทำงาน)",
            },
            {
                image: { src: "input_file_1.png" },
                title: "☀️\nตำแหน่ง: ผู้จัดการฝ่ายกดดันคนอื่นด้วยรอยยิ้มสดใส\n(ยิ้มหวานแต่งานไม่เดิน)",
            },
            {
                image: { src: "input_file_2.png" },
                title: "👅\nตำแหน่ง: หัวหน้าฝ่ายตรวจความพร้อมของลิ้น\n(แลบลิ้นเช็คความพร้อมก่อนเข้าประชุม)",
            },
            {
                image: { src: "input_file_3.png" },
                title: "👀\nตำแหน่ง: Director ฝ่ายมองบนและจับผิดประธาน\n(คอยมองแรงเวลาประธานเริ่มอู้งาน)",
            },
            {
                image: { src: "input_file_4.png" },
                title: "☕\nตำแหน่ง: ผู้แบกบริษัทด้วยการนั่งชิลหลบมุม\n(เน้นล่องหน ไร้ตัวตนแต่จิ้มกาแฟเพลิน)",
            },
        ];

        const COMPONENT_DEFAULTS = {
            slides: DEFAULT_SLIDES,
            cardWidth: 380,
            cardHeight: 460,
            radius: 5,
            tilt: 14,
            sideTilt: 6,
            gap: 9,
            opacity: 65,
            autoplay: false,
            autoplayDirection: "rightToLeft",
            transition: {
                type: "tween",
                duration: 0.6,
                delay: 2.5,
                ease: [0.22, 1, 0.36, 1],
            },
            showTitle: true,
            titleFont: {
                fontFamily: "Mali",
                fontSize: "19px",
                letterSpacing: "0em",
                lineHeight: "1.35em",
            },
            titleColor: "#ffffff",
            titlePosition: {
                position: "bottomLeft",
                paddingLeft: 20,
                paddingRight: 20,
                paddingTop: 20,
                paddingBottom: 20,
            },
        };

        const PERSPECTIVE = 1600;
        const SCALE_STEP = 0.16;
        const MAX_VISIBLE = 2;
        const DEPTH = 240;

        function cssTransition(t) {
            const dur = t && typeof t.duration === 'number' ? t.duration : 0.6;
            let ease = "cubic-bezier(0.22, 1, 0.36, 1)";
            const e = t?.ease;
            if (Array.isArray(e) && e.length === 4) {
                ease = `cubic-bezier(${e[0]}, ${e[1]}, ${e[2]}, ${e[3]})`;
            } else if (typeof e === "string") {
                const map = {
                    linear: "linear",
                    easeIn: "ease-in",
                    easeOut: "ease-out",
                    easeInOut: "ease-in-out",
                };
                ease = map[e] || "ease";
            }
            return { dur, ease };
        }

        function Smooth3DSlideshow(props) {
            props = { ...COMPONENT_DEFAULTS, ...props };
            const {
                slides,
                cardWidth,
                cardHeight,
                radius,
                tilt,
                sideTilt,
                gap,
                opacity,
                transition,
                autoplay,
                autoplayDirection,
                showTitle,
                titleFont,
                titleColor,
                titlePosition,
                style,
            } = props;

            const tp = titlePosition || {};
            const corner = tp.position || "bottomLeft";
            const isTop = corner === "topLeft" || corner === "topRight";
            const isRight = corner === "topRight" || corner === "bottomRight";
            const padLeft = tp.paddingLeft ?? 20;
            const padRight = tp.paddingRight ?? 20;
            const padTop = tp.paddingTop ?? 20;
            const padBottom = tp.paddingBottom ?? 20;

            const list = slides && slides.length ? slides : DEFAULT_SLIDES;
            const n = list.length;
            const loop = true;
            const [active, setActive] = useState(0);

            // Drag State Tracker Variables
            const dragStartX = useRef(0);
            const isDragging = useRef(false);
            const dragThreshold = 50;

            useEffect(() => {
                setActive((a) => Math.max(0, Math.min(n - 1, a)));
            }, [n]);

            const moveDur = transition && typeof transition.duration === "number" ? transition.duration : 0.6;
            const lockRef = useRef(false);
            
            const lock = useCallback(() => {
                lockRef.current = true;
                window.setTimeout(() => {
                    lockRef.current = false;
                }, Math.max(50, moveDur * 1000));
            }, [moveDur]);

            const step = useCallback((dir) => {
                if (lockRef.current) return;
                lock();
                setActive((a) => (((a + dir) % n) + n) % n);
            }, [n, lock]);

            const handleCardClick = useCallback((i) => {
                if (autoplay || lockRef.current) return;
                lock();
                setActive((a) => (i === a ? (a + 1) % n : i));
            }, [autoplay, n, lock]);

            // Pointer interaction functions for Drag & Swipe
            const handlePointerDown = (e) => {
                if (autoplay || lockRef.current) return;
                isDragging.current = true;
                dragStartX.current = e.clientX;
                e.currentTarget.setPointerCapture(e.pointerId);
            };

            const handlePointerMove = (e) => {
                if (!isDragging.current) return;
            };

            const handlePointerUp = (e) => {
                if (!isDragging.current) return;
                isDragging.current = false;
                e.currentTarget.releasePointerCapture(e.pointerId);

                const dragDistance = e.clientX - dragStartX.current;

                if (Math.abs(dragDistance) > dragThreshold) {
                    if (dragDistance > 0) {
                        step(-1);
                    } else {
                        step(1);
                    }
                }
            };

            const delay = transition && typeof transition.delay === "number" ? transition.delay : 2.5;
            
            useEffect(() => {
                if (!autoplay || n < 2) return;
                const ms = Math.max(0.3, delay) * 1000;
                const dir = autoplayDirection === "leftToRight" ? -1 : 1;
                const id = window.setInterval(() => step(dir), ms);
                return () => window.clearInterval(id);
            }, [autoplay, autoplayDirection, delay, n, step]);

            const onKeyDown = useCallback((e) => {
                if (e.key === "ArrowRight") {
                    e.preventDefault();
                    step(1);
                } else if (e.key === "ArrowLeft") {
                    e.preventDefault();
                    step(-1);
                }
            }, [step]);

            const { dur, ease } = cssTransition(transition);
            const transitionCss = `transform ${dur}s ${ease}, opacity ${dur}s ${ease}`;

            const effectiveRadius = (Math.max(0, Math.min(20, radius)) / 20) * (Math.min(cardWidth, cardHeight) / 2);
            const dim = 1 - Math.max(0, Math.min(100, opacity)) / 100;

            const rootStyle = {
                ...(style || {}),
                position: "relative",
                width: "100%",
                height: "100%",
                minWidth: 320,
                minHeight: 360,
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                perspective: `${PERSPECTIVE}px`,
                overflow: "hidden",
                outline: "none",
                touchAction: "none",
                cursor: autoplay ? "default" : "grab"
            };

            return (
                <div
                    style={rootStyle}
                    tabIndex={0}
                    role="group"
                    aria-roledescription="carousel"
                    onKeyDown={onKeyDown}
                    onPointerDown={handlePointerDown}
                    onPointerMove={handlePointerMove}
                    onPointerUp={handlePointerUp}
                    onPointerCancel={handlePointerUp}
                >
                    <div
                        style={{
                            position: "relative",
                            width: cardWidth,
                            height: cardHeight,
                            transformStyle: "preserve-3d",
                            pointerEvents: "none"
                        }}
                    >
                        {list.map((slide, i) => {
                            let rel = i - active;
                            if (loop) {
                                if (rel > n / 2) rel -= n;
                                if (rel < -n / 2) rel += n;
                            }
                            const ax = Math.abs(rel);
                            const visible = ax <= MAX_VISIBLE;
                            const isActive = rel === 0;
                            const sc = Math.max(0.4, 1 - ax * SCALE_STEP);
                            const tx = rel * (gap * 30);
                            const tz = -ax * DEPTH;
                            const ry = -rel * tilt;
                            const rz = rel * sideTilt;
                            const src = slide.image?.src || "";

                            const cardStyle = {
                                position: "absolute",
                                left: "50%",
                                top: "50%",
                                width: cardWidth,
                                height: cardHeight,
                                borderRadius: 24, // ขอบมนน่ารักสไตล์บ้านๆ
                                overflow: "hidden",
                                transformStyle: "preserve-3d",
                                transformOrigin: "center center",
                                transform: `translate(-50%, -50%) translateX(${tx}px) translateZ(${tz}px) rotateY(${ry}deg) rotateZ(${rz}deg) scale(${sc})`,
                                transition: transitionCss,
                                opacity: visible ? 1 : 0,
                                pointerEvents: visible && !autoplay ? "auto" : "none",
                                backgroundColor: "#ffffff",
                                boxShadow: isActive 
                                    ? "0 20px 35px rgba(23, 44, 102, 0.25), 0 0 0 4px #ffffff" 
                                    : "0 10px 20px rgba(0,0,0,0.1)",
                            };

                            return (
                                <div
                                    key={i}
                                    style={cardStyle}
                                    onClick={(e) => {
                                        if(!isDragging.current) handleCardClick(i);
                                    }}
                                    aria-label={slide.title}
                                    aria-hidden={!visible}
                                >
                                    {src ? (
                                        <img
                                            src={src}
                                            alt={slide.title || ""}
                                            draggable={false}
                                            style={{
                                                position: "absolute",
                                                inset: 0,
                                                width: "100%",
                                                height: "100%",
                                                objectFit: "cover",
                                                display: "block",
                                                userSelect: "none",
                                                pointerEvents: "none"
                                            }}
                                        />
                                    ) : null}

                                    {showTitle && (
                                        <React.Fragment>
                                            <div
                                                style={{
                                                    position: "absolute",
                                                    inset: 0,
                                                    background: isTop
                                                        ? "linear-gradient(0deg, rgba(0,0,0,0) 25%, rgba(23,44,102,0.92) 100%)"
                                                        : "linear-gradient(180deg, rgba(0,0,0,0) 25%, rgba(23,44,102,0.92) 100%)",
                                                    pointerEvents: "none",
                                                }}
                                            />

                                            <div
                                                style={{
                                                    position: "absolute",
                                                    left: padLeft,
                                                    right: padRight,
                                                    [isTop ? "top" : "bottom"]: isTop ? padTop : padBottom,
                                                    textAlign: isRight ? "right" : "left",
                                                    pointerEvents: "none",
                                                }}
                                            >
                                                <span
                                                    style={{
                                                        color: titleColor,
                                                        fontSize: 19,
                                                        fontWeight: 600,
                                                        lineHeight: "1.4em",
                                                        whiteSpace: "pre-line",
                                                        textShadow: "0 2px 6px rgba(0,0,0,0.6)",
                                                        ...(titleFont || {}),
                                                    }}
                                                >
                                                    {slide.title}
                                                </span>
                                            </div>
                                        </React.Fragment>
                                    )}

                                    <div
                                        style={{
                                            position: "absolute",
                                            inset: 0,
                                            background: "#172c66",
                                            opacity: isActive ? 0 : dim,
                                            transition: `opacity ${dur}s ${ease}`,
                                            pointerEvents: "none",
                                        }}
                                    />
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // Render Component
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Smooth3DSlideshow />);
    </script>
</body>
</html>
